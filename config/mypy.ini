; mypy configuration for Adaptive Underworld Recon Array (A.U.R.A.)
;
; The first-party application lives in "A.U.R.A. Source". The vendored CPython
; runtime and the installer virtualenv must stay out of analysis: they contain
; ~4,300 modules that are not project code and otherwise bury real findings.

[mypy]
python_version = 3.12
exclude = (?x)(
    /runtime/ |
    /requirements/venv/ |
    /venv/ |
    /venv_app/ |
    /site-packages/ |
    /__pycache__/ |
    /\.mypy_cache/ |
    /build_(installer|standalone|launcher)_temp/ |
    /A\.U\.R\.A Distro/
  )

; Resolve "core.*", "subsystems.*", "ui.*" the same way app.py does at runtime.
mypy_path = A.U.R.A. Source

; Optional native/GPU dependencies (llama_cpp, winocr, pymumble, opuslib, ...)
; ship no type information and are imported defensively at runtime.
ignore_missing_imports = True
follow_imports = silent

; PyQt6 stubs leave many signal/slot attributes implicitly dynamic.
disallow_untyped_defs = False
warn_unused_ignores = False
warn_return_any = False
